[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server giving Claude read and write access to NetBox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SelfSimon" },
]
keywords = ["netbox", "mcp", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=3.4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff==0.16.0",
    "black>=23.0",
    "isort>=5.10",
    "pre-commit>=2.20",
]

[tool.setuptools]
package-dir = { netbox_mcp = "src/netbox_mcp" }

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["netbox_mcp*", "client*", "schemas*", "tools*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "W"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
